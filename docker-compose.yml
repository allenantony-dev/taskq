services:
  postgres:
    image: postgres:17-alpine
    container_name: taskq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskq
      POSTGRES_PASSWORD: taskq
      POSTGRES_DB: taskq
    ports:
      - "5432:5432"
    volumes:
      - taskq-postgres-data:/var/lib/postgresql/data
      - ./database/migrations:/migrations:ro
      - ./database/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskq -d taskq"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  taskq-postgres-data:
