name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Uses the same compose file and init.sh as a local checkout, so CI and
      # the documented setup cannot drift apart.
      - name: Start Postgres
        run: |
          docker compose up -d
          # taskq_test is the last thing init.sh creates, so waiting for it
          # cannot be fooled by the temporary server Postgres runs during init.
          until docker exec taskq-postgres psql -U taskq -d taskq_test -c '\q' 2>/dev/null; do sleep 1; done

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://taskq:taskq@localhost:5432/taskq_test?sslmode=disable
        run: |
          set -o pipefail
          # -count=1 because setup-go caches the build cache, and cached
          # results would replay without touching Postgres.
          go test -count=1 -v -race ./... | tee test.log
          # Every test skips itself when TEST_DATABASE_URL is unset, and a
          # fully skipped run still exits 0. Fail instead of reporting green.
          ! grep -q -- '--- SKIP' test.log
